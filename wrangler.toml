# Cloudflare Worker: serves the React app (dist/) and the API (/api/*).
name = "flonary"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "flonary"
database_id = "b9581bdf-98d6-4091-9233-795285cddf7d"
migrations_dir = "migrations"

[vars]
# Anyone can create an account; each user only sees their own data.
# "false" closes registrations. To restrict to some people, add a variable
# ALLOWED_EMAILS = "a@gmail.com,b@gmail.com".
ALLOW_SIGNUP = "true"
# "true" only if your EODHD plan includes Fundamentals + calendar (country/sector/earnings dates)
EODHD_FUNDAMENTALS = "false"

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars locally):
#   SECRETS_KEY         — random string, encrypts broker tokens stored in D1 (recommended)
#   EODHD_API_KEY       — market data key (https://eodhd.com)
#   EODHD_DAILY_LIMIT   — "100000" on a paid EODHD plan (default 20 = free plan; also enables live quotes)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — optional "Continuer avec Google" button

# Nightly refresh of the tickers held by users (Mon–Fri 22:30 UTC, after the US close)
[triggers]
crons = ["30 22 * * 1-5"]

